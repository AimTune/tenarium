apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenarium-operator
  namespace: tenarium-system
  labels:
    app.kubernetes.io/name: tenarium-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenarium-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenarium-operator
    spec:
      serviceAccountName: tenarium-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: tenarium-operator:dev
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            # Default connection for resources without spec.connectionRef.
            # Remove these two flags to require a TenariumConnection.
            - --tenarium-url=http://tenarium.tenarium-system.svc:8080
            - --tenarium-api-key-secret=tenarium-system/tenarium-operator
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 10
