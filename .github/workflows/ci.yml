name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenarium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start Kafka (Redpanda)
        run: |
          docker run -d --name kafka -p 29092:29092 redpandadata/redpanda:latest redpanda start \
            --mode dev-container --kafka-addr 0.0.0.0:29092 --advertise-kafka-addr localhost:29092
      - name: Test
        env:
          TENARIUM_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/tenarium?sslmode=disable
          TENARIUM_TEST_KAFKA_BROKERS: localhost:29092
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Admin UI tests
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          include-hidden-files: true   # .server/ holds the server log and config
          retention-days: 14
          path: |
            tests/ui/playwright-report
            tests/ui/test-results
            tests/ui/.server/server.log
            tests/ui/.server/config.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/tenarium --set ingress.enabled=true --set autoscaling.enabled=true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tenarium:ci
