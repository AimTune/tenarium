---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tenants.tenarium.io
spec:
  group: tenarium.io
  names:
    categories:
    - tenarium
    kind: Tenant
    listKind: TenantList
    plural: tenants
    shortNames:
    - tnt
    singular: tenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.slug
      name: Slug
      type: string
    - jsonPath: .spec.plan
      name: Plan
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.region
      name: Region
      priority: 1
      type: string
    - jsonPath: .status.health.grade
      name: Health
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .status.id
      name: ID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Tenant is a Tenarium tenant managed from Kubernetes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TenantSpec is the desired state of a Tenarium tenant.

              Optional map fields are managed only when set: leaving labels, settings,
              features or limits out keeps whatever the tenant has in Tenarium.
            properties:
              addOns:
                description: |-
                  AddOns are plan IDs stacked on the plan. When omitted, the add-ons
                  are not managed; an empty list removes them.
                items:
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              billingAnchor:
                description: |-
                  BillingAnchor starts the tenant's monthly billing cycles. Removing it
                  from a spec that set it removes the anchor in Tenarium; when never
                  set, an anchor set elsewhere (e.g. by a billing plugin) is kept.
                format: date-time
                type: string
              branding:
                description: |-
                  Branding customises the tenant's sign-in pages and emails. Removing
                  it from a spec that set it clears the branding in Tenarium; an empty
                  object clears it too. A tenant whose spec never set branding keeps
                  its own.
                properties:
                  accentColor:
                    pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
                    type: string
                  displayName:
                    maxLength: 200
                    type: string
                  iconUrl:
                    maxLength: 2048
                    pattern: ^https://.+
                    type: string
                  logoUrl:
                    maxLength: 2048
                    pattern: ^https://.+
                    type: string
                  primaryColor:
                    pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
                    type: string
                  supportEmail:
                    type: string
                  supportUrl:
                    maxLength: 2048
                    pattern: ^https://.+
                    type: string
                type: object
              connectionRef:
                description: |-
                  ConnectionRef selects the TenariumConnection to use. When omitted, the
                  operator's default connection is used.
                properties:
                  name:
                    description: Name of the TenariumConnection.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides whether deleting this resource deletes the
                  tenant in Tenarium.
                enum:
                - Delete
                - Orphan
                type: string
              features:
                additionalProperties:
                  type: boolean
                description: Features override the plan's features.
                type: object
              labels:
                additionalProperties:
                  type: string
                description: Labels replace the tenant's labels (the operator adds
                  its owner label).
                type: object
              limits:
                additionalProperties:
                  format: int64
                  type: integer
                description: Limits override the plan's limits.
                type: object
              moveReprovision:
                description: |-
                  MoveReprovision makes a region move run the provisioners in the new
                  region, inside a maintenance window that ends when they succeed.
                type: boolean
              name:
                description: Name is the display name. Defaults to the slug.
                maxLength: 200
                type: string
              parent:
                description: Parent makes the tenant a child of another tenant. It
                  cannot change.
                properties:
                  name:
                    description: |-
                      Name of a Tenant resource in the same namespace. The child waits until
                      that Tenant is Ready.
                    type: string
                  slug:
                    description: Slug (or ID) of a tenant that exists in Tenarium.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set exactly one of name and slug
                  rule: has(self.name) != has(self.slug)
              plan:
                description: |-
                  Plan is the ID of the tenant's plan. When omitted, the plan is not
                  managed.
                type: string
              planRevision:
                description: |-
                  PlanRevision pins the tenant to a revision of its plan
                  (grandfathering); 0 follows the plan's current definition. When
                  omitted, the pin is not managed.
                format: int64
                minimum: 0
                type: integer
              region:
                description: |-
                  Region places the tenant (data residency). It is set when the tenant
                  is created; changing it later moves the tenant to the new region
                  (POST /v1/tenants/{id}/move, which needs tenants:move). When omitted,
                  the region is not managed.
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              schedule:
                description: |-
                  Schedule lists actions Tenarium runs later. Each entry is scheduled
                  once; removing a pending entry cancels it.
                items:
                  description: |-
                    ScheduledAction is an action Tenarium runs later for the tenant, e.g. the
                    end of a trial.
                  properties:
                    action:
                      description: Action to run.
                      enum:
                      - suspend
                      - resume
                      - set_plan
                      - delete
                      type: string
                    after:
                      description: |-
                        After is relative to when the action is scheduled: a duration ("36h")
                        or days ("14d").
                      pattern: ^([0-9]+d|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                      type: string
                    at:
                      description: At is an absolute run time.
                      format: date-time
                      type: string
                    plan:
                      description: Plan for set_plan.
                      type: string
                    reason:
                      description: Reason for suspend.
                      type: string
                  required:
                  - action
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of at and after
                    rule: has(self.at) != has(self.after)
                  - message: plan is required for set_plan
                    rule: self.action != 'set_plan' || has(self.plan)
                type: array
                x-kubernetes-list-type: atomic
              settings:
                description: |-
                  Settings is the tenant's free-form settings object. Keys missing here
                  are removed from the tenant.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              slug:
                description: Slug is the tenant's unique, URL-safe identifier. It
                  cannot change.
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
              template:
                description: |-
                  Template is the ID of a tenant template that presets the tenant when
                  it is created (the spec's own values win). It is used only on
                  creation: changing it later has no effect.
                pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                type: string
            required:
            - slug
            type: object
            x-kubernetes-validations:
            - message: slug is immutable
              rule: self.slug == oldSelf.slug
            - message: parent is immutable
              rule: has(self.parent) == has(oldSelf.parent) && (!has(self.parent)
                || self.parent == oldSelf.parent)
          status:
            description: TenantStatus is the observed state of a Tenant.
            properties:
              adopted:
                description: Adopted is true when the tenant existed before and was
                  adopted.
                type: boolean
              billingAnchorManaged:
                description: |-
                  BillingAnchorManaged is true when the operator applied
                  spec.billingAnchor, so removing it removes the anchor in Tenarium.
                type: boolean
              brandingManaged:
                description: |-
                  BrandingManaged is true when the operator applied spec.branding, so
                  removing spec.branding clears the branding in Tenarium.
                type: boolean
              conditions:
                description: 'Conditions: Ready and Synced.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              entitlements:
                description: Entitlements is the tenant's effective plan, features
                  and limits.
                properties:
                  enabledFeatures:
                    description: EnabledFeatures lists the enabled features, sorted.
                    items:
                      type: string
                    type: array
                  limits:
                    additionalProperties:
                      format: int64
                      type: integer
                    type: object
                  plan:
                    type: string
                type: object
              health:
                description: Health is the tenant's health score, refreshed on every
                  sync.
                properties:
                  grade:
                    description: Grade summarizes the score, e.g. "A".
                    type: string
                  score:
                    description: Score from 0 (unhealthy) to 100.
                    type: integer
                required:
                - score
                type: object
              id:
                description: ID of the tenant in Tenarium.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the tenant was last compared with
                  Tenarium.
                format: date-time
                type: string
              maintenance:
                description: Maintenance is the tenant's maintenance window, while
                  one is active.
                properties:
                  active:
                    description: |-
                      Active is true while the window is open: the tenant is read-only for
                      its own users.
                    type: boolean
                  message:
                    type: string
                  moveTo:
                    description: MoveTo is the region a reprovisioning move is heading
                      to.
                    type: string
                  until:
                    description: Until is when the window ends by itself, if set.
                    format: date-time
                    type: string
                required:
                - active
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              parentID:
                description: ParentID is the Tenarium ID of the parent tenant.
                type: string
              phase:
                description: |-
                  Phase is the tenant's Tenarium status: provisioning, active,
                  suspended, failed, deleting or deleted.
                type: string
              planRevision:
                description: |-
                  PlanRevision is the plan revision the tenant is pinned to; 0 follows
                  the plan's current definition.
                format: int64
                type: integer
              region:
                description: Region is the tenant's region in Tenarium.
                type: string
              scheduledActions:
                description: ScheduledActions are the actions scheduled from spec.schedule.
                items:
                  description: ScheduledActionStatus records an action the operator
                    scheduled.
                  properties:
                    action:
                      type: string
                    error:
                      type: string
                    id:
                      description: ID of the scheduled action in Tenarium.
                      type: string
                    key:
                      description: Key identifies the spec entry (a hash of its fields).
                      type: string
                    runAt:
                      format: date-time
                      type: string
                    state:
                      description: 'State: pending, running, done, failed or canceled.'
                      type: string
                  required:
                  - id
                  - key
                  type: object
                type: array
              statusReason:
                description: StatusReason explains the phase (e.g. why provisioning
                  failed).
                type: string
              version:
                description: Version is the remote object version last seen.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
