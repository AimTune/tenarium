[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenarium-middleware"
version = "0.1.0"
description = "Resolve and enforce the current Tenarium tenant in WSGI and ASGI applications."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Source = "https://github.com/AimTune/tenarium/tree/main/sdks/python-middleware"

[tool.setuptools]
packages = ["tenarium_middleware"]
