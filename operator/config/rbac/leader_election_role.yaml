# Leader election (--leader-elect) uses a Lease in the operator's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenarium-operator-leader-election
  namespace: tenarium-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenarium-operator-leader-election
  namespace: tenarium-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenarium-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: tenarium-operator
    namespace: tenarium-system
