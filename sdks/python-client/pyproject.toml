[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenarium-client"
version = "0.1.0"
description = "Typed client for the Tenarium REST API, generated from its OpenAPI spec."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Source = "https://github.com/AimTune/tenarium/tree/main/sdks/python-client"

[tool.setuptools]
packages = ["tenarium_client"]

[tool.setuptools.package-data]
tenarium_client = ["py.typed"]
