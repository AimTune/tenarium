# NGINX in front of tenant cells, with tenarium-gateway as the
# auth_request endpoint (see docs/gateway.md).
#
#   nginx -c /etc/nginx/nginx.conf   # this file
#
# Flow: every request triggers a subrequest to /_tenarium_auth, which
# proxies to tenarium-gateway's /nginx endpoint with X-Original-URI,
# X-Original-Method and X-Original-Host. On 2xx the X-Tenant-* response
# headers are captured with auth_request_set, set on the upstream request
# and X-Tenant-Cell picks the upstream through a map. auth_request only
# understands 2xx, 401 and 403, so the gateway answers every other denial
# with 403 and the real status in X-Tenarium-Status; @tenarium_denied
# turns it back into 404, 429 or 503.

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream tenarium_gateway {
        server tenarium-gateway:8090;
        keepalive 32;
    }

    # One upstream per cell; the names are what the map below produces.
    upstream cell_shared    { server app-shared:8080; }
    upstream cell_eu_1      { server app-eu-1:8080; }
    upstream cell_dedicated { server app-dedicated:8080; }

    # X-Tenant-Cell -> upstream. Unknown cells go to the shared cell.
    map $tenant_cell $cell_upstream {
        default    cell_shared;
        eu-1       cell_eu_1;
        dedicated  cell_dedicated;
    }

    server {
        listen 8080;
        server_name _;

        location = /_tenarium_auth {
            internal;
            proxy_pass http://tenarium_gateway/nginx;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The check needs headers only.
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # The original request; Authorization and the other request
            # headers are passed along by default.
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-Host   $host;
            proxy_set_header X-Original-Proto  $scheme;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        location / {
            auth_request /_tenarium_auth;
            auth_request_set $tenant_id       $upstream_http_x_tenant_id;
            auth_request_set $tenant_slug     $upstream_http_x_tenant_slug;
            auth_request_set $tenant_plan     $upstream_http_x_tenant_plan;
            auth_request_set $tenant_cell     $upstream_http_x_tenant_cell;
            auth_request_set $tenant_features $upstream_http_x_tenant_features;
            auth_request_set $tenarium_status $upstream_http_x_tenarium_status;
            auth_request_set $tenarium_error  $upstream_http_x_tenarium_error;
            auth_request_set $retry_after     $upstream_http_retry_after;
            auth_request_set $rl_limit        $upstream_http_ratelimit_limit;
            auth_request_set $rl_remaining    $upstream_http_ratelimit_remaining;
            auth_request_set $rl_reset        $upstream_http_ratelimit_reset;
            error_page 401 403 = @tenarium_denied;

            # proxy_set_header replaces whatever the client sent; an empty
            # value drops the header.
            proxy_set_header X-Tenant-Id       $tenant_id;
            proxy_set_header X-Tenant-Slug     $tenant_slug;
            proxy_set_header X-Tenant-Plan     $tenant_plan;
            proxy_set_header X-Tenant-Cell     $tenant_cell;
            proxy_set_header X-Tenant-Features $tenant_features;
            proxy_set_header Host              $host;

            add_header RateLimit-Limit     $rl_limit always;
            add_header RateLimit-Remaining $rl_remaining always;
            add_header RateLimit-Reset     $rl_reset always;

            proxy_pass http://$cell_upstream;
        }

        # Restores the gateway's real status code for denials.
        location @tenarium_denied {
            default_type application/json;
            add_header X-Tenarium-Error $tenarium_error always;
            add_header Retry-After      $retry_after always;
            if ($tenarium_status = 404) { return 404 '{"error":{"code":"$tenarium_error"}}\n'; }
            if ($tenarium_status = 429) { return 429 '{"error":{"code":"rate_limited"}}\n'; }
            if ($tenarium_status = 503) { return 503 '{"error":{"code":"$tenarium_error"}}\n'; }
            if ($tenarium_status = 401) { return 401 '{"error":{"code":"unauthorized"}}\n'; }
            return 403 '{"error":{"code":"$tenarium_error"}}\n';
        }
    }
}
